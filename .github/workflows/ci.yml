# CI — the integration suite on both supported platforms, plus shellcheck.
#
# The suite (tests/run-all.sh) is CI-friendly by construction: every test runs
# on a throwaway tmux socket with private XDG cache/config dirs, so no isolation
# tricks are needed here. fish is installed so t-shim's end-to-end pane check
# exercises the fish -C re-prepend path instead of its degraded fallback.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux fish zoxide

      # macOS ships bash 3.2; the daemon and CLI need 4+ (associative arrays). Prepend
      # brew's bin so `bash` resolves to the new one in later steps.
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tmux fish bash zoxide
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Toolchain sanity
        run: |
          bash --version | head -1
          tmux -V
          bash -c '(( BASH_VERSINFO[0] >= 4 ))'

      # bin/afui is the only renderer; run-all.sh refuses to start without it.
      - uses: actions/setup-go@v5
        with:
          go-version-file: ui/go.mod
      - name: Build the native UI
        run: make ui

      - name: Run integration suite
        run: bash tests/run-all.sh

  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ui/go.mod
      # The snapshot parser's tests read tests/fixtures/snapshot, the same
      # fixtures t-fixtures.sh drives through the bash readers.
      - name: Vet, format, test
        run: make ui-test
      # The binary embeds AGENT_FLEET_VERSION from bin/agent-fleet; a drift
      # between the two would make `af upgrade` misjudge what is installed.
      - name: Build and check the embedded version
        run: |
          make ui
          want="$(sed -n 's/^AGENT_FLEET_VERSION="\(.*\)"/\1/p' bin/agent-fleet)"
          got="$(bin/afui version)"
          [[ "$got" == "afui $want" ]] || { echo "version drift: $got vs $want"; exit 1; }

  # Fleet Desktop: the workspace's tests (fleet-tmux's run against a real tmux),
  # then the app opened on the runner's GUI session over a scratch pane.
  desktop:
    name: desktop (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux
        run: brew install tmux
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      # rustup installs the toolchain desktop/rust-toolchain.toml pins.
      - name: Test
        run: cargo test --workspace
      - name: Open the window over a scratch pane
        run: |
          cargo build -p fleet-desktop
          tmux -L ci -f /dev/null new-session -d -s demo -x 90 -y 26 \
            "printf '\033[1mFleet Desktop\033[0m on macOS\n\033[31mred \033[32mgreen \033[38;2;235;111;146mtruecolor\033[0m 日本語 ✓\n'; exec sh"
          AGENT_FLEET_SOCKET=ci ./target/debug/fleet-desktop demo & pid=$!
          sleep 8
          tmux -L ci send-keys -t demo 'echo live after attach' Enter
          sleep 2
          kill -0 "$pid"
          screencapture -x "$RUNNER_TEMP/fleet-desktop.png" || true
          kill "$pid"
      # P3: six tiles under a synthetic agent redraw storm; frame timing in the log.
      - name: Six-tile redraw storm
        run: |
          (sleep 12; screencapture -x "$RUNNER_TEMP/fleet-desktop-p3.png" || true) &
          bash bench/p3.sh 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-desktop-macos
          path: ${{ runner.temp }}/fleet-desktop*.png
          if-no-files-found: ignore

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version the repo is kept clean against — the runner's
      # older shellcheck (0.10) fires SC2015-info on sites 0.11 accepts, so an
      # unpinned lint gate would red on tool drift, not on code.
      - name: Install shellcheck 0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz" | tar -xJ
          sudo mv shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      # Severity policy lives in .shellcheckrc (only source-following notices
      # disabled globally); everything else is fixed or carries a justified
      # per-line disable. SC2086 (quoting) stays enabled.
      - name: Lint shell sources
        run: shellcheck bin/agent-fleet scripts/*.sh shims/* tests/*.sh docker/*.sh

  # The optional owned-worker backend is Python and Linux-only; ordinary fleet
  # never imports it. Sandbox tests skip themselves when the runner forbids
  # unprivileged user namespaces.
  owned-backend:
    name: owned backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap git python3
      - name: Run backend tests
        run: python3 -m unittest discover -s backends/owned/tests -t .
